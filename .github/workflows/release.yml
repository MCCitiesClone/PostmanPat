name: Build & Release

on:
  push:
    branches:
      - kotlin
    paths-ignore:
      - '.github/**'
      - '**.md'

# Allow the workflow to push the version-bump commit and publish releases.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip runs triggered by our own version-bump commit to avoid an infinite loop.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump patch version
        id: bump
        run: |
          current=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' build.gradle.kts)
          if [ -z "$current" ]; then
            echo "::error::Could not read current version from build.gradle.kts"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current"
          new="$major.$minor.$((patch + 1))"
          echo "Bumping version: $current -> $new"
          sed -i -E "s/^(version\s*=\s*\")[0-9]+\.[0-9]+\.[0-9]+(\")/\1${new}\2/" build.gradle.kts
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Build jar
        run: ./gradlew build --no-daemon

      - name: Commit version bump
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          generate_release_notes: true
          files: build/libs/*.jar
